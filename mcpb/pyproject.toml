[project]
name = "overte-mcp"
version = "0.1.0"
description = "Overte (open-source Vircadia-lineage metaverse) Model Context Protocol server for domain administration and in-world entity orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.scripts]
overte-mcp = "overte_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overte_mcp"]
